# ⚠️ 이 파일은 보관본이다. 실행되지 않는다.
#
# GitHub Actions 는 `.github/workflows/` 안의 파일만 읽는다. 이 파일은
# `.github/workflows-archive/` 에 있으므로 push 해도 아무 일도 일어나지 않는다.
#
# 왜 보관했는가:
#   2026-08-20, Vercel 의 GitHub 연동(Git Integration)이 정상 연결됐다.
#   이제 push 하면 Vercel 이 스스로 배포하므로 이 워크플로는 중복이다.
#   그대로 두면 한 번의 push 에 배포가 두 번(Actions + Vercel) 일어난다.
#
# 되살리는 방법 (Vercel 연동이 다시 깨졌을 때):
#   1. 폴더를 되돌린다
#        git mv .github/workflows-archive/deploy.yml .github/workflows/deploy.yml
#   2. VERCEL_TOKEN 시크릿이 남아 있는지 확인한다 (없으면 재발급)
#        gh secret list --repo hyunwoo-company/kdy-math
#        토큰 발급: https://vercel.com/account/tokens
#        등록:      gh secret set VERCEL_TOKEN --repo hyunwoo-company/kdy-math
#   3. Vercel 대시보드에서 git 연동을 끊는다 (안 끊으면 이중 배포가 된다)
#        https://vercel.com/jenu8628s-projects/kdy-math/settings/git → Disconnect
#   4. commit → push. Actions 탭에서 실행을 확인한다.
#
#   자세한 배경과 절차는 DEPLOY.md 4절에 있다.
#
# ── 아래는 원래 워크플로 내용 (수정하지 말고 그대로 보관) ──
#
# 동작:
#   main 브랜치 push        → 운영 배포 (kdy-math.vercel.app 갱신)
#   그 외 브랜치 / PR push  → 미리보기 배포 (임시 주소, 운영에 영향 없음)
#   Actions 탭에서 수동 실행 (workflow_dispatch) 도 가능

name: Deploy to Vercel

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 push 시 이전 실행을 취소해 배포 순서가 뒤바뀌는 것을 막는다
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # 이 두 ID 는 비밀값이 아니다(.vercel/project.json 에 저장되는 공개 식별자).
  # VERCEL_TOKEN 없이는 아무 동작도 할 수 없으므로 노출되어도 무해하다.
  VERCEL_ORG_ID: team_7iwrzJr44lLPXbYw3SKYSp47
  VERCEL_PROJECT_ID: prj_1tD1R6EE39Q3bBCXUriwEMoibpji

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      # 실제 빌드는 Vercel 이 수행한다. 여기서는 빠르게 잡히는 오류만 미리 걸러
      # 잘못된 코드가 배포 큐까지 가지 않게 한다.
      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: 운영 배포
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: 미리보기 배포
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: npx vercel@latest deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
